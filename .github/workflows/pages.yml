name: deploy-pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm test
      - name: Build site (テスト用ファイルは含めない)
        run: |
          mkdir dist
          cp -r index.html privacy.html ads.js ads-config.js style.css game.js sw.js manifest.webmanifest icon.svg data dist/
          rm -rf dist/data/telemetry
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/deploy-pages@v4
